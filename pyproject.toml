[project]
name = "offer-engine"
version = "0.1.0"
description = "Personalised Offer Engine: decides which offer, if any, each Customer gets, and when."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot[job-queue]>=22.8",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[project.scripts]
offer-engine = "offer_engine.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temp files go on the project disk, not the RAM-backed /tmp: parallel runs build several worlds. pytest
# clears --basetemp at the start of each run.
addopts = "-ra -n auto --basetemp=.pytest-tmp"
pythonpath = ["."]
markers = [
    "live: talks to Telegram or the Claude API; run with -m live",
    "slow: long-running; run with -m slow",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "filelock>=4.2.4",
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]
