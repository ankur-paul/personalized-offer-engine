<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offer Engine live view</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/world.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Offer Engine <span class="muted">live view</span></h1>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button id="theme" class="ghost" type="button">Dark theme</button>
  </header>

  <div class="layout">
    <aside class="ticker" aria-labelledby="ticker-title">
      <h2 id="ticker-title">Latest Decisions</h2>
      <ol id="ticker"></ol>
      <button id="ticker-more" class="ghost" type="button" aria-controls="ticker" aria-expanded="false">Show 20</button>
    </aside>

    <nav class="scenarios" id="scenarios" aria-label="Scenarios"></nav>

    <main class="main">
      <section class="bar" id="bar" aria-label="The simulated world">
        <dl class="counters" id="counters"></dl>
        <div class="controls">
          <div class="switch" role="group" aria-labelledby="agent-label">
            <span id="agent-label" class="switch-label">Agent</span>
            <button type="button" data-mode="replay" aria-pressed="false">Replay</button>
            <button type="button" data-mode="live" aria-pressed="false">Live</button>
          </div>
          <div class="reset" id="reset">
            <button type="button" class="danger-outline" id="reset-ask">Reset</button>
          </div>
        </div>
      </section>
      <section class="diagram-wrap" id="diagram-wrap" aria-label="The Decision pipeline">
        <svg id="diagram" role="group" aria-label="Decision pipeline, stage by stage"></svg>
      </section>
      <article class="card" id="card" aria-live="polite">
        <p class="eyebrow">How to use this page</p>
        <h2>Watch the engine decide</h2>
        <p>Pick a scenario. Each stage of the Decision lights up as the engine reaches it, with what it
          saw and why. Click a row under Latest Decisions to play back a Decision made earlier.</p>
      </article>
      <div class="panels" id="panels"></div>
      <section id="world"></section>
    </main>

  </div>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module">
    import { mountWorld } from "/static/world.js";
    // Glossary tooltips come from app.js once its glossary has loaded.
    const world = mountWorld(document.getElementById("world"), {
      terms: (text) => (typeof window.withTerms === "function" ? window.withTerms(text) : null),
    });
    document.addEventListener("glossary", () => world.redraw());
  </script>
</body>
</html>
